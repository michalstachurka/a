name: Deploy to GitHub Pages

# Publikacja przez gałąź gh-pages: GITHUB_TOKEN nie może tworzyć witryny Pages
# przez API (enablement), ale gałąź gh-pages aktywuje Pages automatycznie.
# Strona to statyczne pliki w korzeniu repo, więc wystarczy mirror gałęzi.

on:
  push:
    branches: [claude/pensive-planck-ltpbzh]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror branch to gh-pages
        run: git push --force origin HEAD:gh-pages
